{% extends "base.html" %}

{% block title %}{{ author.name }} – Book Alchemy{% endblock %}

{% block content %}
  <h1>{{ author.name }}</h1>
  <h2>Books</h2>
  <ul>
    {% for book in author.books %}
    <li><a href="{{ url_for('book_detail', book_id=book.id) }}">{{ book.title }}</a></li>
    {% endfor %}
  </ul>
  <form action="{{ url_for('delete_author', author_id=author.id) }}" method="POST">
    <button class="danger" type="submit" aria-label="Delete author: {{ author.name }}">Delete author</button>
  </form>
{% endblock %}
