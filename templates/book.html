<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ book.title }} – Book Alchemy</title>
  </head>
  <body>
  {% include "nav.html" %}
  {% include "flash_messages.html" %}

    <h1>{{ book.title }}</h1>
    <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn | urlencode }}-M.jpg"
         alt="Cover of {{ book.title }}" width="120" height="180">
    <dl>
      <dt>Author</dt>
      <dd><a href="{{ url_for('author_detail', author_id=book.author.id) }}">{{ book.author.name }}</a></dd>
      <dt>ISBN</dt>
      <dd>{{ book.isbn }}</dd>
      <dt>Publication year</dt>
      <dd>{{ book.publication_year or "unknown" }}</dd>
      <dt>Rating</dt>
      <dd>{{ "%d/10" % book.rating if book.rating else "not rated yet" }}</dd>
    </dl>
    <form action="{{ url_for('rate_book', book_id=book.id) }}" method="POST">
      <label for="rating">Your rating (1–10):</label>
      <input type="number" id="rating" name="rating" min="1" max="10" step="1"
             value="{{ book.rating or '' }}" required>
      <button type="submit">Rate</button>
    </form>
    <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST">
      <button type="submit" aria-label="Delete book: {{ book.title }}">Delete book</button>
    </form>

  </body>
</html>
