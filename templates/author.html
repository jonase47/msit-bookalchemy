<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ author.name }} – Book Alchemy</title>
  </head>
  <body>
  {% include "nav.html" %}

    <h1>{{ author.name }}</h1>
    <h2>Books</h2>
    <ul>
      {% for book in author.books %}
      <li><a href="{{ url_for('book_detail', book_id=book.id) }}">{{ book.title }}</a></li>
      {% endfor %}
    </ul>
    <form action="{{ url_for('delete_author', author_id=author.id) }}" method="POST">
      <button type="submit" aria-label="Delete author: {{ author.name }}">Delete author</button>
    </form>

  </body>
</html>
